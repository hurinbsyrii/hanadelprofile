<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae4ec" />
      <stop offset="100%" stop-color="#f8ccd9" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce2d6" />
      <stop offset="100%" stop-color="#f7d4c5" />
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e889a5" />
      <stop offset="100%" stop-color="#cf6684" />
    </linearGradient>
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f3f8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#b44d6c" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" fill="url(#bgGrad)" rx="28" />

  <!-- Decorative Sparkles / Floating Elements -->
  <circle cx="60" cy="80" r="12" fill="#ffffff" opacity="0.6" />
  <circle cx="340" cy="110" r="8" fill="#ffffff" opacity="0.6" />
  <circle cx="350" cy="280" r="14" fill="#ffffff" opacity="0.5" />
  <circle cx="45" cy="330" r="9" fill="#ffffff" opacity="0.4" />

  <g transform="translate(190, 70) scale(0.6)">
    <path d="M0 -20 L5 -5 L20 0 L5 5 L0 20 L-5 5 L-20 0 L-5 -5 Z" fill="#ffffff" opacity="0.8"/>
  </g>
  <g transform="translate(320, 60) scale(0.7)">
    <path d="M0 -20 L5 -5 L20 0 L5 5 L0 20 L-5 5 L-20 0 L-5 -5 Z" fill="#cf6684" opacity="0.6"/>
  </g>

  <!-- Student Illustration (Secondary School Student) -->
  <g filter="url(#softGlow)">
    <!-- Shoulders / School Uniform Pinafore / Baju Kurung -->
    <path d="M90 480 C95 380, 130 350, 200 350 C270 350, 305 380, 310 480 Z" fill="url(#uniformGrad)" />
    <!-- School Tie / Badge / Collar Detail -->
    <path d="M175 350 L200 400 L225 350 Z" fill="#3b5998" />
    <path d="M192 390 L208 390 L204 430 L200 435 L196 430 Z" fill="#2d4373" />
    <!-- Prefect Badge -->
    <rect x="135" y="380" width="32" height="14" rx="3" fill="#eab308" />
    <text x="151" y="391" font-size="7" font-weight="bold" fill="#713f12" text-anchor="middle" font-family="sans-serif">PREFECT</text>

    <!-- Hijab Base / Drape -->
    <path d="M120 220 C100 280, 115 365, 200 365 C285 365, 300 280, 280 220 Z" fill="url(#hijabGrad)" />

    <!-- Head / Face Outline -->
    <ellipse cx="200" cy="205" rx="55" ry="65" fill="url(#skinGrad)" />

    <!-- Hijab Frame around Face -->
    <path d="M142 195 C142 130, 258 130, 258 195 C258 245, 240 270, 200 270 C160 270, 142 245, 142 195 Z" fill="none" stroke="url(#hijabGrad)" stroke-width="26" />
    <path d="M135 185 C140 120, 260 120, 265 185 C270 240, 250 280, 200 280 C150 280, 130 240, 135 185 Z" fill="url(#hijabGrad)" />
    
    <!-- Face Inner Cutout -->
    <ellipse cx="200" cy="210" rx="46" ry="52" fill="url(#skinGrad)" />

    <!-- Cute Eyes -->
    <ellipse cx="182" cy="208" rx="5" ry="7" fill="#2e1c27" />
    <ellipse cx="218" cy="208" rx="5" ry="7" fill="#2e1c27" />
    <circle cx="180" cy="206" r="2" fill="#ffffff" />
    <circle cx="216" cy="206" r="2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M174 195 Q183 192 191 196" fill="none" stroke="#68424e" stroke-width="2.5" stroke-linecap="round" />
    <path d="M209 196 Q217 192 226 195" fill="none" stroke="#68424e" stroke-width="2.5" stroke-linecap="round" />

    <!-- Gentle Blush -->
    <ellipse cx="172" cy="222" rx="9" ry="5" fill="#f48ca9" opacity="0.4" />
    <ellipse cx="228" cy="222" rx="9" ry="5" fill="#f48ca9" opacity="0.4" />

    <!-- Nose & Warm Smile -->
    <path d="M198 218 Q200 221 202 218" fill="none" stroke="#e0a996" stroke-width="2" stroke-linecap="round" />
    <path d="M190 232 Q200 242 210 232" fill="none" stroke="#b34966" stroke-width="3" stroke-linecap="round" />

    <!-- Glasses (Smart Student Aesthetic) -->
    <rect x="168" y="198" width="28" height="20" rx="6" fill="none" stroke="#7e4a5d" stroke-width="2.2" opacity="0.9" />
    <rect x="204" y="198" width="28" height="20" rx="6" fill="none" stroke="#7e4a5d" stroke-width="2.2" opacity="0.9" />
    <path d="M196 207 L204 207" stroke="#7e4a5d" stroke-width="2.2" />
  </g>

  <!-- Bottom Student Name Badge -->
  <g transform="translate(60, 420)">
    <rect width="280" height="42" rx="21" fill="#ffffff" filter="url(#softGlow)" />
    <text x="140" y="22" font-size="12" font-weight="bold" fill="#b84c6c" text-anchor="middle" font-family="sans-serif" letter-spacing="1">HANA DELISHA</text>
    <text x="140" y="34" font-size="9" font-weight="500" fill="#755a66" text-anchor="middle" font-family="sans-serif">FORM 3 • PREFECT • AGE 15</text>
  </g>
</svg>
