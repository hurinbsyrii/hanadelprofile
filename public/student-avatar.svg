<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1827" />
      <stop offset="100%" stop-color="#2d0a15" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce5da" />
      <stop offset="100%" stop-color="#f5d5c7" />
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb0ba" />
      <stop offset="100%" stop-color="#c5919d" />
    </linearGradient>
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf9" />
      <stop offset="100%" stop-color="#eee4d8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" fill="url(#bgGrad)" rx="28" />

  <!-- Warm sand decorative circles & editorial sparkle elements -->
  <circle cx="60" cy="80" r="14" fill="#dfb0ba" opacity="0.2" />
  <circle cx="340" cy="110" r="10" fill="#dfb0ba" opacity="0.25" />
  <circle cx="350" cy="300" r="16" fill="#dfb0ba" opacity="0.15" />
  <circle cx="45" cy="350" r="12" fill="#dfb0ba" opacity="0.15" />

  <g transform="translate(190, 60) scale(0.65)">
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="#dfb0ba" opacity="0.7"/>
  </g>
  <g transform="translate(325, 75) scale(0.55)">
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="#eee4d8" opacity="0.6"/>
  </g>

  <!-- Student Illustration -->
  <g filter="url(#softGlow)">
    <!-- Shoulders & Uniform -->
    <path d="M90 480 C95 380, 130 350, 200 350 C270 350, 305 380, 310 480 Z" fill="url(#uniformGrad)" />
    <!-- School Tie / Vest / Collar -->
    <path d="M175 350 L200 405 L225 350 Z" fill="#3d121e" />
    <path d="M192 395 L208 395 L204 435 L200 440 L196 435 Z" fill="#2d0a15" />
    <!-- Gold Prefect Badge -->
    <rect x="135" y="380" width="34" height="15" rx="3" fill="#eab308" />
    <text x="152" y="391" font-size="7.5" font-weight="bold" fill="#582a08" text-anchor="middle" font-family="sans-serif">PREFECT</text>

    <!-- Hijab Base Drape -->
    <path d="M118 220 C98 280, 115 365, 200 365 C285 365, 302 280, 282 220 Z" fill="url(#hijabGrad)" />

    <!-- Head / Face Base -->
    <ellipse cx="200" cy="205" rx="55" ry="65" fill="url(#skinGrad)" />

    <!-- Hijab Outer Frame -->
    <path d="M135 185 C140 120, 260 120, 265 185 C270 240, 250 280, 200 280 C150 280, 130 240, 135 185 Z" fill="url(#hijabGrad)" />
    
    <!-- Face Inner Cutout -->
    <ellipse cx="200" cy="210" rx="46" ry="52" fill="url(#skinGrad)" />

    <!-- Cute Eyes -->
    <ellipse cx="182" cy="208" rx="5" ry="7" fill="#2d0a15" />
    <ellipse cx="218" cy="208" rx="5" ry="7" fill="#2d0a15" />
    <circle cx="180" cy="206" r="2.2" fill="#ffffff" />
    <circle cx="216" cy="206" r="2.2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M173 194 Q183 191 192 195" fill="none" stroke="#522a36" stroke-width="2.6" stroke-linecap="round" />
    <path d="M208 195 Q217 191 227 194" fill="none" stroke="#522a36" stroke-width="2.6" stroke-linecap="round" />

    <!-- Soft Cheek Blush -->
    <ellipse cx="170" cy="222" rx="9" ry="5" fill="#dfb0ba" opacity="0.6" />
    <ellipse cx="230" cy="222" rx="9" ry="5" fill="#dfb0ba" opacity="0.6" />

    <!-- Nose & Smile -->
    <path d="M198 217 Q200 220 202 217" fill="none" stroke="#d49b89" stroke-width="2" stroke-linecap="round" />
    <path d="M190 231 Q200 241 210 231" fill="none" stroke="#872942" stroke-width="3" stroke-linecap="round" />

    <!-- Smart Glasses -->
    <rect x="167" y="197" width="29" height="21" rx="6" fill="none" stroke="#5a2333" stroke-width="2.2" opacity="0.9" />
    <rect x="204" y="197" width="29" height="21" rx="6" fill="none" stroke="#5a2333" stroke-width="2.2" opacity="0.9" />
    <path d="M196 207 L204 207" stroke="#5a2333" stroke-width="2.2" />
  </g>

  <!-- Bottom Student Badge Pill -->
  <g transform="translate(50, 420)">
    <rect width="300" height="42" rx="21" fill="#f5eee6" filter="url(#softGlow)" />
    <text x="150" y="22" font-size="11.5" font-weight="900" fill="#3d121e" text-anchor="middle" font-family="sans-serif" letter-spacing="1.5">HANA DELISHA NAZRI</text>
    <text x="150" y="34" font-size="9" font-weight="700" fill="#872942" text-anchor="middle" font-family="sans-serif" letter-spacing="0.5">SECONDARY SCHOOL • FORM 3 • AGE 15</text>
  </g>
</svg>
